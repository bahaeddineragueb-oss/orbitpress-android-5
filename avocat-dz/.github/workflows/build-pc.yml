name: Build PC (Windows)

on:
  push:
    branches: [main, arena/*]
    paths: ["avocat-dz/**"]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avocat-dz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: avocat-dz/package-lock.json
      - run: npm ci
      - run: npm run build:pc
      - run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Maktabi-Windows
          path: |
            avocat-dz/dist/*.exe
            avocat-dz/dist/*.blockmap
          if-no-files-found: error
