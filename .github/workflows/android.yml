name: Android build

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main, arena/* ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build and Test
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest :app:assembleRelease > build_log.txt 2>&1; then
            echo "::error title=Build Failure::$(grep -E 'e: |error: |FAILURE:' build_log.txt | head -n 20)"
            tail -n 120 build_log.txt
            exit 1
          fi
      - name: Verify release APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/*.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitpress-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0-native-compose
          name: "OrbitPress 5.0.0 (Native Jetpack Compose)"
          body: |
            ### 🚀 OrbitPress v5.0.0 Release
            - Native Jetpack Compose Material 3 interface
            - EncryptedSharedPreferences and MasterKey security
            - Asynchronous Coroutines + StateFlow architecture
            - Storage Access Framework (SAF) JSON backup & restore
            - WordPress REST API and Pinterest v5 publishing
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
